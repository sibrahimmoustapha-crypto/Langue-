<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Prix - Composant Personnalisable</title>
    <style>
        .pricing {
            width: 300px;
            margin: auto;
            background-color: #fff;
            box-shadow: 0 0 10px #ccc;
            padding: 20px;
            text-align: left;
            border-radius: 8px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            color: #1e293b;
        }

        .price {
            font-size: 18px;
            color: green;
            margin-bottom: 15px;
        }

        .features {
            list-style: none;
            padding-left: 0;
            margin-bottom: 20px;
        }

        .features li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .btn {
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

    <div class="pricing">
        <h2 class="title">Forfait de base</h2>
        <p class="price">9,99 $/mois</p>
        
        <ul class="features">
            <li>1 Go de stockage</li>
            <li>Assistance de base</li>
            <li>Toutes les fonctionnalités principales</li>
        </ul>

        <button class="btn">Démarrer l'essai</button>
    </div>

</body>
</html>
